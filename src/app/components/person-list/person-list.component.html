<div class="container mx-auto p-6 fade-in">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">{{ 'person.title' | transloco }}</h1>
      <div class="flex gap-2">
        <button
          mat-raised-button
          color="accent"
          (click)="exportToExcel()"
          class="flex items-center gap-2">
          <mat-icon>table_chart</mat-icon>
          {{ 'export.excel' | transloco }}
        </button>
        <button
          mat-raised-button
          color="accent"
          (click)="exportToPDF()"
          class="flex items-center gap-2">
          <mat-icon>picture_as_pdf</mat-icon>
          {{ 'export.pdf' | transloco }}
        </button>

        <button
          mat-raised-button
          color="primary"
          (click)="onAddPerson()"
          class="flex items-center gap-2">
          <mat-icon>add</mat-icon>
          {{ 'person.addPerson' | transloco }}
        </button>
      </div>
    </div>

    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg p-6 mb-6 shadow-sm">
      <div class="flex items-center mb-4">
        <mat-icon class="text-blue-600 mr-2">filter_list</mat-icon>
        <h3 class="text-lg font-semibold text-gray-700">
          {{ 'person.filters' | transloco }}
        </h3>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <mat-form-field class="w-full">
          <mat-label>{{ 'person.name' | transloco }}</mat-label>
          <input
            matInput
            [(ngModel)]="nameFilter"
            (ngModelChange)="onFilterChange()"
            [placeholder]="'person.searchByName' | transloco">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>{{ 'person.email' | transloco }}</mat-label>
          <input
            matInput
            [(ngModel)]="emailFilter"
            (ngModelChange)="onFilterChange()"
            [placeholder]="'person.searchByEmail' | transloco">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="flex items-center">
          <button
            mat-raised-button
            (click)="clearFilters()"
            class="w-full">
            <mat-icon>clear</mat-icon>
            {{ 'common.reset' | transloco }}
          </button>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto">
      <ng2-smart-table
        [settings]="settings"
        [source]="filteredPersons"
        (edit)="onEditPerson($event)"
        (delete)="onDeletePerson($event)">
      </ng2-smart-table>
    </div>
  </div>
</div>
